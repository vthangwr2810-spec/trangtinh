                eng.rootPvLen = 1;
                eng.rootPv[0] = m0;
                if (pr.pv.length > 0 && pr.pv[0].equals(pr.best)) {
                  for (int k = 1; k < pr.pv.length && k < 8; k++) {
                    if (pr.pv[k].length() < 4) break;
                    eng.rootPv[eng.rootPvLen++] = Uci.parse(pr.pv[k]);
                  }
                }
                r = new int[]{m0, sc0, pr.depth};
                tag = "Pikafish";
                engTry = 0;
              } else {
                r = eng.best(B, 6000);
              }
              if (r == null) { say("Hết nước đi", "Ván cờ đã kết thúc?"); return; }
              String chk = eng.gives(B, r[0]) ? " · CHIẾU!" : "";
              say("▶ " + Notation.viet(B, r[0]), Notation.sq(B, r[0]) + chk + "\n" + eng.verdict(r[1]) + " · sâu " + r[2] + " · " + tag + "\nDự kiến: " + eng.line(B, 5));
            }

            @Override public void onDestroy() {
              running = false;
              try { if (bubble != null) wm.removeView(bubble); } catch (Exception e) { }
              try { if (calib != null) wm.removeView(calib); } catch (Exception e) { }
              try { if (rbtn != null) wm.removeView(rbtn); } catch (Exception e) { }
              try { if (vd != null) vd.release(); } catch (Exception e) { }
              try { if (reader != null) reader.close(); } catch (Exception e) { }
              try { if (proj != null) proj.stop(); } catch (Exception e) { }
              try { if (uci != null) uci.stop(); } catch (Exception e) { }
              if (ht != null) ht.quitSafely();
              super.onDestroy();
            }
          }
          EOF

      - name: Build Pikafish (engine manh nhat)
        continue-on-error: true
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          echo "NDK=$NDK"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$TC:$PATH"
          which aarch64-linux-android21-clang++
          git clone --depth 1 https://github.com/official-pikafish/Pikafish.git /tmp/pikafish
          OUTD="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$OUTD"
          cd /tmp/pikafish/src
          make -j"$(nproc)" build ARCH=armv8 COMP=ndk EXTRALDFLAGS="-Wl,-z,max-page-size=16384"
          "$TC/llvm-strip" pikafish
          cp pikafish "$OUTD/libpikafish.so"
          make clean || true
          if make -j"$(nproc)" build ARCH=armv8-dotprod COMP=ndk EXTRALDFLAGS="-Wl,-z,max-page-size=16384"; then
            "$TC/llvm-strip" pikafish
            cp pikafish "$OUTD/libpikafish_dp.so"
          else
            echo "Khong build duoc ban dotprod, chi dung ban armv8"
          fi
          ls -l "$OUTD"

      - name: Tai mang NNUE cua Pikafish (BAT BUOC - thieu file nay engine se tu thoat)
        run: |
          set -e
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --max-time 900 -o app/src/main/assets/pikafish.nnue https://github.com/official-pikafish/Networks/releases/download/master-net/pikafish.nnue
          SZ=$(stat -c %s app/src/main/assets/pikafish.nnue)
          echo "NNUE size: $SZ"
          test "$SZ" -gt 10000000

      - name: Kiem tra engine da duoc build
        run: |
          test -f app/src/main/jniLibs/arm64-v8a/libpikafish.so || { echo "LOI: build Pikafish that bai, APK se khong co engine manh"; exit 1; }

      - name: Build APK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: CoTuongHelper-APK
          path: app/build/outputs/apk/debug/app-debug.apk
