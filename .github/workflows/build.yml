          package com.cotuong.helper;

          // Theo dõi ván cờ chỉ bằng "ô nào có quân màu gì" (rất ổn định), không đọc lại chữ trên quân mỗi lần quét.
          // Bàn cờ: 90 ô, quân mình (nửa dưới) > 0, đối thủ < 0. occ: 0 trống, 1 đỏ, 2 đen. mineC = màu của mình trong occ.
          class Track {
            static int[] startBoard() {
              int[] back = {5, 4, 3, 2, 1, 2, 3, 4, 5};
              int[] S = new int[90];
              for (int c = 0; c < 9; c++) { S[c] = -back[c]; S[81 + c] = back[c]; }
              S[19] = -6; S[25] = -6; S[64] = 6; S[70] = 6;
              for (int c = 0; c < 9; c += 2) { S[27 + c] = -7; S[54 + c] = 7; }
              return S;
            }

            static boolean occEq(int[] b, int[] occ, int mineC) {
              for (int i = 0; i < 90; i++) {
                int p = b[i];
                int e = p == 0 ? 0 : (p > 0 ? mineC : 3 - mineC);
                if (occ[i] != e) return false;
              }
              return true;
            }

            // Số ô khác nhau giữa bàn đang theo dõi và màn hình (để báo lỗi dễ hiểu)
            static int diff(int[] b, int[] occ, int mineC) {
              int n = 0;
              for (int i = 0; i < 90; i++) {
                int p = b[i];
                int e = p == 0 ? 0 : (p > 0 ? mineC : 3 - mineC);
                if (occ[i] != e) n++;
              }
              return n;
            }

            // Màn hình đang ở thế xuất phát (32 quân đúng chỗ) -> không cần đọc chữ trên quân
            static boolean isStartOcc(int[] occ, int mineC) {
              return occEq(startBoard(), occ, mineC);
            }

            static void apply(int[] b, int m) {
              b[m & 255] = b[m >> 8];
              b[m >> 8] = 0;
            }

            // Tìm 1 hoặc 2 nước đi hợp lệ (bên đang tới lượt đi trước) đưa bàn B tới đúng thế occ trên màn hình.
            // Trả về mảng rỗng nếu chưa có gì thay đổi, null nếu không có nước nào khớp.
            static int[] explain(Engine e, int[] B, boolean mineTurn, int[] occ, int mineC) {
              if (occEq(B, occ, mineC)) return new int[0];
              e.init(B);
              int s = mineTurn ? 1 : -1;
              int[] m1 = new int[160];
              int n1 = e.gen(s, m1, false);
              int[] m2 = new int[160];
              for (int i = 0; i < n1; i++) {
                int a = m1[i];
                int ca = e.make(a);
                if (e.inCheck(s)) { e.unmake(a, ca); continue; }
                if (occEq(e.b, occ, mineC)) { e.unmake(a, ca); return new int[]{a}; }
                int n2 = e.gen(-s, m2, false);
                for (int j = 0; j < n2; j++) {
                  int c = m2[j];
                  int cc = e.make(c);
                  boolean ok = !e.inCheck(-s) && occEq(e.b, occ, mineC);
                  e.unmake(c, cc);
                  if (ok) { e.unmake(a, ca); return new int[]{a, c}; }
                }
                e.unmake(a, ca);
              }
              return null;
            }
          }
