              for (int p : B) { if (p == 1) kM++; if (p == -1) kO++; }
              if (kM != 1 || kO != 1) {
                say("Thiếu Tướng/Soái", "Kiểm tra căn lưới (giữ bong bóng) hoặc chạm để đọc lại");
                return;
              }
