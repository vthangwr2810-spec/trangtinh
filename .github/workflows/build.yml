          package com.cotuong.helper;

          // So khớp hình chữ trên quân cờ với mẫu cắt từ ván xếp đủ quân của game (cả 2 bên đỏ/đen).
          class Glyph {
            static final int N = 24;
            static final int[] REDT = {5, 4, 3, 2, 1, 2, 3, 4, 5, 6, 6, 7, 7, 5, 4, 3, 2, 1, 2, 3, 4, 5, 6, 6, 7, 7};
            static final String[] REDD = {"", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""};
            static final int[] BLKT = {5, 4, 3, 2, 1, 2, 3, 4, 5, 6, 6, 7, 7, 5, 4, 3, 2, 1, 2, 3, 4, 5, 6, 6, 7, 7};
            static final String[] BLKD = {"", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""};
            static float[][] redF, blkF;
            static float lastScore;
            static int lastType;

            static int lum(int p) { return (((p >> 16) & 255) * 30 + ((p >> 8) & 255) * 59 + (p & 255) * 11) / 100; }

            static boolean red(int p) {
              int r = (p >> 16) & 255, g = (p >> 8) & 255, b = p & 255;
              return r > 130 && r - g > 55 && r - b > 55;
            }

            static boolean ink(int p) { return red(p) || lum(p) < 100; }

            static float[][] parse(String[] s) {
              float[][] f = new float[s.length][N * N];
              for (int k = 0; k < s.length; k++) for (int i = 0; i < N * N; i++) f[k][i] = (s[k].charAt(i) - '0') / 9f;
              return f;
            }

            // px: vùng vuông n*n ARGB quanh tâm quân cờ (n = 2R+1)
            static float[] feature(int[] px, int n) {
              int R = n / 2;
              float[] c = new float[N * N];
              for (int i = 0; i < N; i++) {
                int ya = i * n / N, yb = Math.max(ya + 1, (i + 1) * n / N);
                for (int j = 0; j < N; j++) {
                  int xa = j * n / N, xb = Math.max(xa + 1, (j + 1) * n / N), cnt = 0;
                  for (int y = ya; y < yb; y++) for (int x = xa; x < xb; x++) {
                    int dx = x - R, dy = y - R;
                    if (dx * dx + dy * dy <= R * R && ink(px[y * n + x])) cnt++;
                  }
                  c[i * N + j] = cnt / (float) ((yb - ya) * (xb - xa));
                }
              }
              float[] f = new float[N * N];   // làm mờ 3x3
              for (int i = 0; i < N; i++) for (int j = 0; j < N; j++) {
                float s = 0;
                for (int a = -1; a <= 1; a++) for (int b = -1; b <= 1; b++) {
                  int y = i + a, x = j + b;
                  if (y >= 0 && y < N && x >= 0 && x < N) s += c[y * N + x];
                }
                f[i * N + j] = s / 9f;
              }
              return f;
            }

            // So với mọi mẫu cùng màu; trả về điểm giống nhất và ghi loại quân (1..7) vào lastType
            static float match(float[] f, boolean isRed) {
              if (redF == null) { redF = parse(REDD); blkF = parse(BLKD); }
              float[][] T = isRed ? redF : blkF;
              int[] ty = isRed ? REDT : BLKT;
              float nf = 0, best = -1;
              for (float v : f) nf += v * v;
              if (nf < 1e-6f) return -1;
              for (int k = 0; k < T.length; k++) {
                float d = 0, nt = 0;
                for (int i = 0; i < N * N; i++) { d += f[i] * T[k][i]; nt += T[k][i] * T[k][i]; }
                float s = d / (float) Math.sqrt(nf * nt + 1e-9);
                if (s > best) { best = s; lastType = ty[k]; }
              }
              return best;
            }
          }
