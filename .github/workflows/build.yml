          package com.cotuong.helper;

          import android.graphics.Bitmap;
          import java.util.Arrays;

          class Recog {
            static final int SG = 64;
            final int[] occ = new int[90];      // 0 trống, 1 đỏ, 2 đen
            final int[] type = new int[90];
            final int[] cachedOcc = new int[90];
            final int[] sig = new int[90 * SG];
            final boolean[] ok = new boolean[90];
            int unknown, mineOcc = 1;
            String unknownAt = "";

            void reset() { Arrays.fill(ok, false); }

            static int lum(int p) { return Glyph.lum(p); }
            static boolean red(int p) { return Glyph.red(p); }

            // Quét 90 giao điểm: quân nào có viền tròn tối quanh tâm. Trả về chuỗi để so sánh ổn định.
            String scan(Bitmap bm, float[] g) {
              grabPixels(bm);
              StringBuilder sb = new StringBuilder(90);
              int[] cnt = new int[3];
              for (int i = 0; i < 90; i++) {
                float cx = g[0] + (i % 9) * g[2], cy = g[1] + (i / 9) * g[3];
                int o = 0;
                if (ringDark(bm, cx, cy, g[2]) > 0.6f) o = isRed(bm, cx, cy, g[2]) ? 1 : 2;
                occ[i] = o;
                sb.append(o);
                if (i / 9 >= 7 && o > 0) cnt[o]++;
              }
              mineOcc = cnt[1] >= cnt[2] ? 1 : 2;   // màu đa số ở nửa dưới = quân của mình
              return sb.toString();
            }

            // Viền quân của game này nhỏ (bán kính ~0,38 ô) và mảnh; game cũ ~0,45 ô. Dò cả dải 0,32-0,48, mỗi điểm cho lệch ±2 px.
            static final double[] CA = new double[48], SA = new double[48];
            static {
              for (int k = 0; k < 48; k++) { CA[k] = Math.cos(k * Math.PI / 24); SA[k] = Math.sin(k * Math.PI / 24); }
            }

            int[] pix = new int[0];
            int pw, ph;

            // Đọc cả khung hình vào mảng một lần cho nhanh (getPixel từng điểm rất chậm)
            void grabPixels(Bitmap bm) {
              pw = bm.getWidth(); ph = bm.getHeight();
              if (pix.length != pw * ph) pix = new int[pw * ph];
              bm.getPixels(pix, 0, pw, 0, 0, pw, ph);
            }

            // Mỗi điểm trên vòng cho lệch +-4 px theo bán kính nên chịu được lưới căn lệch vài px.
            float ringDark(Bitmap bm, float cx, float cy, float st) {
              int w = pw, h = ph;
              float best = 0;
              for (float f = 0.32f; f <= 0.481f; f += 0.01f) {
                int d = 0, t = 0;
                for (int k = 0; k < 48; k++) {
                  float x0 = cx + (float) CA[k] * f * st, y0 = cy + (float) SA[k] * f * st;
                  if (x0 < 5 || y0 < 5 || x0 >= w - 5 || y0 >= h - 5) continue;
                  t++;
                  for (int o = -4; o <= 4; o++) {
                    int x = Math.round(x0 + (float) CA[k] * o), y = Math.round(y0 + (float) SA[k] * o);
                    if (lum(pix[y * w + x]) < 125) { d++; break; }
                  }
                }
                if (t > 24) best = Math.max(best, (float) d / t);
              }
              return best;
            }

            boolean isRed(Bitmap bm, float cx, float cy, float st) {
              int r = 0, d = 0, w = bm.getWidth(), h = bm.getHeight();
              for (int a = -8; a <= 8; a++) for (int b = -8; b <= 8; b++) {
                if (a * a + b * b > 64) continue;
                int x = Math.round(cx + a * st * 0.036f), y = Math.round(cy + b * st * 0.036f);
                if (x < 0 || y < 0 || x >= w || y >= h) continue;
                int p = bm.getPixel(x, y);
                if (red(p)) r++; else if (lum(p) < 90) d++;
              }
              return r > d;
            }

            int[] signature(Bitmap bm, float cx, float cy, float st) {
              int[] s = new int[SG];
              int w = bm.getWidth(), h = bm.getHeight();
              for (int a = 0; a < 8; a++) for (int b = 0; b < 8; b++) {
                int x = Math.round(cx + (a - 3.5f) * 0.085f * st), y = Math.round(cy + (b - 3.5f) * 0.085f * st);
                s[a * 8 + b] = (x < 0 || y < 0 || x >= w || y >= h) ? 0 : lum(bm.getPixel(x, y));
              }
              return s;
            }

            // Trả về bàn cờ: quân của mình (nửa dưới) dương, đối thủ âm. Quân đọc không ra = ±9.
            int[] classify(Bitmap bm, float[] g, boolean force) {
              if (force) reset();
              int[] B = new int[90];
              unknown = 0;
              StringBuilder u = new StringBuilder();
              for (int i = 0; i < 90; i++) {
                if (occ[i] == 0) { ok[i] = false; continue; }
                float cx = g[0] + (i % 9) * g[2], cy = g[1] + (i / 9) * g[3];
                int[] s = signature(bm, cx, cy, g[2]);
                boolean same = ok[i] && cachedOcc[i] == occ[i];
                if (same) {
                  int d = 0;
                  for (int k = 0; k < SG; k++) d += Math.abs(s[k] - sig[i * SG + k]);
                  same = d < SG * 10;
                }
                if (!same) {
                  type[i] = ocr(bm, cx, cy, g[2], occ[i] == 1, occ[i] == mineOcc ? i / 9 : 9 - i / 9, i % 9);
                  System.arraycopy(s, 0, sig, i * SG, SG);
                  cachedOcc[i] = occ[i];
                  ok[i] = type[i] != 0;
                }
                int sg = occ[i] == mineOcc ? 1 : -1;
                if (type[i] == 0) {
                  unknown++;
                  u.append(" [cột ").append(i % 9 + 1).append(" dòng ").append(i / 9 + 1).append(" từ trên]");
                  B[i] = sg * 9;
                } else B[i] = sg * type[i];
              }
              unknownAt = u.toString();
              return B;
            }

            // Thử lệch vài pixel quanh tâm (chịu sai số căn lưới), lấy mẫu giống nhất
            int ocr(Bitmap bm, float cx, float cy, float st, boolean isRed, int rr, int c) {
              int R = Math.round(0.33f * st), n = 2 * R + 1;
              int[] px = new int[n * n];
              float best = -1;
              int bt = 0;
              for (int dx = -6; dx <= 6; dx += 3) for (int dy = -6; dy <= 6; dy += 3) {
                int x = Math.round(cx) + dx - R, y = Math.round(cy) + dy - R;
                if (x < 0 || y < 0 || x + n > bm.getWidth() || y + n > bm.getHeight()) continue;
                bm.getPixels(px, 0, n, x, y, n, n);
                float s = Glyph.match(Glyph.feature(px, n), isRed, rr, c);
                if (s > best) { best = s; bt = Glyph.lastType; }
              }
              return best >= 0.7f ? bt : 0;
            }
          }
