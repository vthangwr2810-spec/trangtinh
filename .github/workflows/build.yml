                if (tmp.length() < 1000000) { tmp.delete(); netErr = "file NNUE trong APK bị hỏng"; return null; }
                if (out.exists()) out.delete();
                if (!tmp.renameTo(out)) { netErr = "không ghi được file NNUE"; return null; }
