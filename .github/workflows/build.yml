          package com.cotuong.helper;

          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileReader;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.util.Arrays;
          import java.util.concurrent.LinkedBlockingQueue;
          import java.util.concurrent.TimeUnit;

          // Chạy Pikafish (UCI) như một tiến trình con. Tệp thực thi nằm trong thư mục thư viện native của app.
          class Uci {
            static class Res {
              String best = "";
              int cp, depth, mateIn;
              boolean mate;
              String[] pv = new String[0];
            }

            Process p;
            OutputStream os;
            final LinkedBlockingQueue<String> q = new LinkedBlockingQueue<String>();
            volatile boolean ready;
            String name = "";
            volatile String err = "";
            String nnue = "";

            static boolean hasDotprod() {
              try (BufferedReader br = new BufferedReader(new FileReader("/proc/cpuinfo"))) {
                String l;
                while ((l = br.readLine()) != null) if (l.startsWith("Features") && l.contains("asimddp")) return true;
              } catch (Exception e) { }
              return false;
            }

            boolean start(String nativeDir, String nnuePath) {
              nnue = nnuePath;
              String[] cand = hasDotprod() ? new String[]{"libpikafish_dp.so", "libpikafish.so"} : new String[]{"libpikafish.so"};
              err = "";
              for (String f : cand) {
                File ex = new File(nativeDir, f);
                if (!ex.exists()) { err = "thiếu " + f; continue; }
                try {
                  if (boot(ex)) { name = f; return true; }
                  if (err.isEmpty()) err = "không phản hồi (" + f + ")";
                } catch (Throwable t) { err = f + ": " + t.getMessage(); }
                stop();
              }
              return false;
            }

            boolean boot(File ex) throws Exception {
              ProcessBuilder pb = new ProcessBuilder(ex.getAbsolutePath());
              pb.redirectErrorStream(true);
              final Process pr = pb.start();
              p = pr;
              os = pr.getOutputStream();
              q.clear();
              Thread rd = new Thread(new Runnable() {
                @Override public void run() {
                  try (BufferedReader br = new BufferedReader(new InputStreamReader(pr.getInputStream()))) {
                    String l;
                    while ((l = br.readLine()) != null) q.offer(l);
                  } catch (Exception e) { }
                  q.offer("#eof");
                }
              });
              rd.setDaemon(true);
              rd.start();
              send("uci");
              if (!waitFor("uciok", 20000)) return false;
              send("setoption name EvalFile value " + nnue);
              int th = Math.min(8, Math.max(1, Runtime.getRuntime().availableProcessors()));
              send("setoption name Threads value " + th);
              send("setoption name Hash value 128");
              send("isready");
              if (!waitFor("readyok", 40000)) return false;
              ready = true;
              return true;
            }

            void send(String s) throws Exception {
              os.write((s + "\n").getBytes("UTF-8"));
              os.flush();
            }

            boolean waitFor(String tok, long ms) throws Exception {
              long end = System.currentTimeMillis() + ms;
              while (System.currentTimeMillis() < end) {
                String l = q.poll(200, TimeUnit.MILLISECONDS);
                if (l == null) continue;
                if (l.startsWith("info string ERROR")) err = l.substring(12);
                if (l.equals("#eof")) return false;
                if (l.startsWith(tok)) return true;
              }
              return false;
            }

            Res go(String fen, int ms) {
              Res r = new Res();
              try {
                q.clear();
                send("position fen " + fen);
                send("go movetime " + ms);
                long end = System.currentTimeMillis() + ms + 10000, hard = end + 4000;
                boolean stopped = false;
                while (true) {
                  long now = System.currentTimeMillis();
                  if (now > hard) break;
                  if (now > end && !stopped) { send("stop"); stopped = true; }
                  String l = q.poll(200, TimeUnit.MILLISECONDS);
                  if (l == null) continue;
                  if (l.startsWith("info string ERROR")) err = l.substring(12);
                  if (l.equals("#eof")) { ready = false; break; }
                  if (l.startsWith("bestmove")) {
                    String[] t = l.split(" ");
                    if (t.length > 1) r.best = t[1];
                    break;
                  }
                  if (l.startsWith("info") && l.contains(" pv ") && !l.contains("bound")) info(l, r);
                }
              } catch (Throwable t) { ready = false; }
              return r;
            }

            void info(String l, Res r) {
              try {
                String[] t = l.split(" ");
                for (int i = 0; i + 1 < t.length; i++) if (t[i].equals("multipv") && !t[i + 1].equals("1")) return;
                for (int i = 0; i < t.length; i++) {
                  String k = t[i];
                  if (k.equals("depth") && i + 1 < t.length) r.depth = Integer.parseInt(t[i + 1]);
                  else if (k.equals("score") && i + 2 < t.length) {
                    r.mate = t[i + 1].equals("mate");
                    if (r.mate) r.mateIn = Integer.parseInt(t[i + 2]); else r.cp = Integer.parseInt(t[i + 2]);
                  } else if (k.equals("pv")) { r.pv = Arrays.copyOfRange(t, i + 1, t.length); break; }
                }
              } catch (Exception e) { }
            }

            void abort() {
              try { if (ready && os != null) send("stop"); } catch (Throwable t) { }
            }

            void newGame() throws Exception {
              send("ucinewgame");
              send("isready");
              waitFor("readyok", 10000);
            }

            void stop() {
              ready = false;
              try { if (os != null) { os.write("quit\n".getBytes("UTF-8")); os.flush(); } } catch (Exception e) { }
              try { if (p != null) p.destroy(); } catch (Exception e) { }
              p = null; os = null;
            }

            // Bàn cờ 90 ô (mình > 0, ở dưới) -> FEN cờ tướng; mình = quân hoa (chữ in), đi trước
            static String fen(int[] B) {
              String L = " kabnrcp";
              StringBuilder sb = new StringBuilder();
              for (int r = 0; r < 10; r++) {
                int e = 0;
                for (int c = 0; c < 9; c++) {
                  int v = B[r * 9 + c];
                  if (v == 0) { e++; continue; }
                  if (e > 0) { sb.append(e); e = 0; }
                  char ch = L.charAt(Math.abs(v));
                  sb.append(v > 0 ? Character.toUpperCase(ch) : ch);
                }
                if (e > 0) sb.append(e);
                if (r < 9) sb.append('/');
              }
              return sb.append(" w - - 0 1").toString();
            }

            // "h2e2" -> from << 8 | to (hàng 0 = phía trên)
            static int parse(String m) {
              int f = (9 - (m.charAt(1) - '0')) * 9 + (m.charAt(0) - 'a');
              int t = (9 - (m.charAt(3) - '0')) * 9 + (m.charAt(2) - 'a');
              return (f << 8) | t;
            }
          }
