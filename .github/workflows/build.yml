              if (f || lastB == null) nt = !(isStart(B) && recog.mineOcc == 2);   // mình cầm đen thì đỏ đi trước
              else {
                int vac = 0, mover = 0;
                for (int i = 0; i < 90; i++) if (B[i] == 0 && lastB[i] != 0) { vac++; mover = lastB[i]; }
                if (vac == 1) nt = mover < 0;   // quân đối thủ vừa đi -> tới lượt mình
              }
              String why = bad(B, nt);
              if (why != null) {
