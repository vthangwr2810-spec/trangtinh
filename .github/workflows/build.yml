              waiting = true;
              setWaitBtn(true);
              say("Đang chờ đối thủ đi…", "Bạn cứ đi nước của mình; app tự đợi tới khi thấy đối thủ đi xong");
            }

            // Ván mới: xoá toàn bộ trí nhớ, báo Pikafish bắt đầu ván mới và đọc/tính lại từ đầu
            void newGame() {
              if (!running) return;
              cancel = true;
              waiting = false;
              setWaitBtn(false);
              if (uci != null) uci.abort();
              say("Ván mới…", "Đang đặt lại");
              bg.post(new Runnable() {
                @Override public void run() {
                  prevOcc = ""; cur = null; turnMine = true; stableN = 0; miss = 0; lastNote = "";
                  if (recog != null) recog.reset();
                  eng.reset();
                  try { if (uci != null && uci.ready) uci.newGame(); } catch (Throwable t) { }
                  force = true;
                  say("Ván mới — đang đọc bàn cờ…", null);
                }
              });
            }

            // Kiểm tra bàn cờ đọc được có hợp lý không (chống đọc sai quân dẫn tới nước đi khờ)
            String bad(int[] B, boolean mineTurn) {
              int[][] cnt = new int[2][8];
              for (int i = 0; i < 90; i++) {
                int p = B[i];
                if (p == 0) continue;
                int t = Math.abs(p), s = p > 0 ? 0 : 1, c = i % 9, rr = p > 0 ? i / 9 : 9 - i / 9;
                cnt[s][t]++;
                if (t == 1 && !(rr >= 7 && c >= 3 && c <= 5)) return "Tướng nằm ngoài cung";
                if (t == 2 && !(((rr == 9 || rr == 7) && (c == 3 || c == 5)) || (rr == 8 && c == 4))) return "Có Sĩ nằm sai chỗ";
                if (t == 3 && !(((rr == 9 || rr == 5) && (c == 2 || c == 6)) || (rr == 7 && (c == 0 || c == 4 || c == 8)))) return "Có Tượng nằm sai chỗ";
                if (t == 7 && (rr > 6 || (rr > 4 && c % 2 == 1))) return "Có Tốt nằm sai chỗ";
              }
              for (int s = 0; s < 2; s++) {
                int[] k = cnt[s];
                if (k[2] > 2 || k[3] > 2 || k[4] > 2 || k[5] > 2 || k[6] > 2 || k[7] > 5) return "Thừa quân (đọc nhầm loại quân)";
              }
              if (mineTurn) {
                eng.init(B);
                if (eng.inCheck(-1)) return "Đối thủ đang bị chiếu: đọc sai quân, hoặc chưa tới lượt bạn";
              } else {
                eng.init(B);
                if (eng.inCheck(1)) return "Bên dưới đang bị chiếu: đọc sai quân, hoặc chọn nhầm bên đi trước";
              }
              return null;
            }
            void say(final String big, final String small) {
              ui.post(new Runnable() {
                @Override public void run() {
                  if (bubble == null) return;
                  SpannableStringBuilder sb = new SpannableStringBuilder(big);
                  sb.setSpan(new RelativeSizeSpan(1.35f), 0, big.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                  sb.setSpan(new StyleSpan(Typeface.BOLD), 0, big.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                  if (small != null) sb.append("\n").append(small);
                  bubble.setText(sb);
                }
              });
            }

            // ---------- Căn lưới ----------
            class GridOverlay extends View {
              final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              final int[] loc = new int[2];
              float lx, ly;
              GridOverlay(Context c) { super(c); p.setStyle(Paint.Style.STROKE); }
              @Override protected void onDraw(Canvas c) {
                getLocationOnScreen(loc);
                float ox = loc[0], oy = loc[1];
                p.setStrokeWidth(2);
                p.setColor(0xAA00FF00);
                for (int r = 0; r < 10; r++)
                  c.drawLine(g[0] - ox, g[1] + r * g[3] - oy, g[0] + 8 * g[2] - ox, g[1] + r * g[3] - oy, p);
                for (int k = 0; k < 9; k++)
                  c.drawLine(g[0] + k * g[2] - ox, g[1] - oy, g[0] + k * g[2] - ox, g[1] + 9 * g[3] - oy, p);
                p.setStrokeWidth(3);
                p.setColor(0xCCFFEB3B);
                for (int r = 0; r < 10; r++) for (int k = 0; k < 9; k++)
                  c.drawCircle(g[0] + k * g[2] - ox, g[1] + r * g[3] - oy, 0.45f * g[2], p);
              }
              @Override public boolean onTouchEvent(MotionEvent e) {
                if (e.getAction() == MotionEvent.ACTION_DOWN) { lx = e.getRawX(); ly = e.getRawY(); return true; }
                if (e.getAction() == MotionEvent.ACTION_MOVE) {
                  g[0] += e.getRawX() - lx; g[1] += e.getRawY() - ly;
                  lx = e.getRawX(); ly = e.getRawY();
                  invalidate();
                }
                return true;
              }
            }

            void showCalib() {
              if (calibrating) return;
              calibrating = true;
              final GridOverlay gv = new GridOverlay(this);
              calib = new FrameLayout(this);
              calib.addView(gv, new FrameLayout.LayoutParams(-1, -1));
              TextView tip = new TextView(this);
              tip.setText("Kéo lưới cho các vòng vàng khớp từng quân cờ.\nW/H: chỉnh độ rộng/cao ô. Xong bấm LƯU.");
              tip.setTextColor(Color.WHITE);
              tip.setBackgroundColor(0xCC000000);
              tip.setPadding(24, 24, 24, 24);
              FrameLayout.LayoutParams tl = new FrameLayout.LayoutParams(-1, -2);
              tl.gravity = Gravity.TOP;
              calib.addView(tip, tl);
              LinearLayout bar = new LinearLayout(this);
              bar.setBackgroundColor(0xCC000000);
              String[] names = {"W-", "W+", "H-", "H+", "LƯU"};
              for (int k = 0; k < 5; k++) {
                final int kk = k;
                Button b = new Button(this);
                b.setText(names[k]);
                b.setOnClickListener(new View.OnClickListener() {
                  @Override public void onClick(View v) {
                    if (kk == 0) g[2] -= 1;
                    else if (kk == 1) g[2] += 1;
                    else if (kk == 2) g[3] -= 1;
                    else if (kk == 3) g[3] += 1;
                    else { saveCalib(); return; }
                    gv.invalidate();
                  }
                });
                bar.addView(b, new LinearLayout.LayoutParams(0, -2, 1));
              }
              FrameLayout.LayoutParams bl = new FrameLayout.LayoutParams(-1, -2);
              bl.gravity = Gravity.BOTTOM;
              calib.addView(bar, bl);
              WindowManager.LayoutParams lp = new WindowManager.LayoutParams(-1, -1,
                  WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                      | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                  PixelFormat.TRANSLUCENT);
              if (Build.VERSION.SDK_INT >= 28)
                lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
              wm.addView(calib, lp);
            }

            void saveCalib() {
              sp.edit().putFloat("x0", g[0]).putFloat("y0", g[1]).putFloat("sx", g[2]).putFloat("sy", g[3]).apply();
              wm.removeView(calib);
              calib = null;
              last = null;
              recog.reset();
              prevOcc = "";
              cur = null;
              waiting = false;
              setWaitBtn(false);
              calibrating = false;
              say("Căn lưới xong", "Bấm \"↻ Ván mới\" để đọc bàn cờ\nSau mỗi nước của bạn: bấm nút xanh \"⏱ Đối thủ đi\"\n" + engNote);
              bg.removeCallbacks(loop);
              bg.postDelayed(loop, 1200);
            }

            // ---------- Vòng lặp đọc bàn cờ ----------
            final Runnable loop = new Runnable() {
              @Override public void run() {
                if (!running) return;
                try { tick(); } catch (Throwable t) { say("Lỗi", String.valueOf(t)); }
                bg.postDelayed(this, waiting ? 350 : 500);
              }
            };

            Bitmap toBmp(Image img) {
              Image.Plane pl = img.getPlanes()[0];
              ByteBuffer buf = pl.getBuffer();
              int w = pl.getRowStride() / pl.getPixelStride();
              Bitmap bm = Bitmap.createBitmap(w, img.getHeight(), Bitmap.Config.ARGB_8888);
              bm.copyPixelsFromBuffer(buf);
              if (w != img.getWidth()) {
                Bitmap c = Bitmap.createBitmap(bm, 0, 0, img.getWidth(), img.getHeight());
                bm.recycle();
                return c;
              }
              return bm;
            }

            // Chỉ quét khi cần: vừa bấm "Ván mới"/chạm bong bóng (force) hoặc đang chờ đối thủ đi (waiting)
            void tick() {
              if (calibrating) return;
              if (!force && !waiting) return;
              Image img = reader.acquireLatestImage();
              if (img != null) {
                Bitmap nb = toBmp(img);
                img.close();
                last = nb;
              }
              Bitmap bm = last;
              if (bm == null) return;
              String occ = recog.scan(bm, g);
              if (force) {
                force = false;
                waiting = false;
                setWaitBtn(false);
                fullRead(bm);
                return;
              }
              // đang chờ: đợi bàn cờ đổi rồi đứng yên (hết hiệu ứng quân bay)
              if (!occ.equals(prevOcc)) { prevOcc = occ; stableN = 0; return; }
              stableN++;
              if (stableN < 1 || cur == null) return;
              int[] o = recog.occ.clone();
              int[] r = Track.explain(eng, cur, turnMine, o, mineC);
              if (r != null && r.length == 0) { miss = 0; return; }   // chưa có gì thay đổi: tiếp tục đợi
              if (r == null) {
                miss++;
                if (miss == 4) say("Chưa khớp nước đi…", "Lệch " + Track.diff(cur, o, mineC) + " ô so với bàn cờ đang theo dõi. Nếu kẹt, chạm bong bóng để đọc lại.");
                if (miss >= 10) { miss = 0; rereadWhileWaiting(bm); }
                return;
              }
              miss = 0;
              StringBuilder note = new StringBuilder();
              for (int m : r) {
                String t = turnMine ? Notation.viet(cur, m) : Notation.viet(Engine.flip(cur), Engine.fm(m));
                if (note.length() > 0) note.append("  ·  ");
                note.append(turnMine ? "Bạn: " : "Đối thủ: ").append(t);
                Track.apply(cur, m);
                turnMine = !turnMine;
              }
              lastNote = note.toString();
              if (!turnMine) { say("Đã ghi nước của bạn", lastNote + "\nĐang chờ đối thủ đi…"); return; }
              waiting = false;
              setWaitBtn(false);
              suggest();
            }

            // Đọc bàn cờ từ màn hình (đọc chữ trên quân). Thế xuất phát thì khỏi đọc chữ. Trả về false nếu đọc không ổn.
            void fullRead(Bitmap bm) {
              int pieces = 0;
              for (int i = 0; i < 90; i++) if (recog.occ[i] != 0) pieces++;
              if (pieces < 2) { say("Chưa thấy bàn cờ", "Giữ bong bóng để căn lại lưới"); return; }
              mineC = recog.mineOcc;
              int[] o = recog.occ.clone();
              boolean start = Track.isStartOcc(o, mineC);
              int[] B = start ? Track.startBoard() : readBoard(bm);
              if (B == null) return;
              cur = B;
              turnMine = !(start && mineC == 2);   // mình cầm đen thì đỏ đi trước
              lastNote = "";
              if (!turnMine) {
                prevOcc = ""; stableN = 0; miss = 0;
                waiting = true;
                setWaitBtn(true);
                say("Đối thủ đi trước…", "App đang chờ đối thủ đi xong");
                return;
              }
              suggest();
            }

            // Kẹt không khớp nước: đọc lại cả bàn; nếu đọc ổn thì coi như tới lượt mình
            void rereadWhileWaiting(Bitmap bm) {
              recog.mineOcc = mineC;
              int[] B = readBoard(bm);
              if (B == null) return;
              cur = B;
              turnMine = true;
              lastNote = "Đã đọc lại bàn cờ";
              waiting = false;
              setWaitBtn(false);
              suggest();
            }

            int[] readBoard(Bitmap bm) { return readBoard(bm, true, false); }

            // quiet = true: không báo lỗi lên bong bóng (dùng khi thử nhiều cách đọc)
            int[] readBoard(Bitmap bm, boolean mineMoves, boolean quiet) {
              int[] B = recog.classify(bm, g, true);
              if (recog.unknown > 0) {
                if (!quiet) say("Không đọc được " + recog.unknown + " quân", "Chạm bong bóng để thử lại." + recog.unknownAt);
                return null;
              }
              int kM = 0, kO = 0;
              for (int p : B) { if (p == 1) kM++; if (p == -1) kO++; }
              if (kM != 1 || kO != 1) {
                if (!quiet) say("Thiếu Tướng/Soái", "Kiểm tra căn lưới (giữ bong bóng) hoặc chạm để đọc lại");
                return null;
              }
              String why = bad(B, mineMoves);
              if (why != null) {
                recog.reset();
                if (!quiet) say("Bàn cờ đọc có vẻ sai", why + "\nChạm bong bóng để đọc lại · Giữ: căn lại lưới");
                return null;
              }
              return B;
            }

            // Tính nước tốt nhất cho bàn cờ đang theo dõi (tới lượt mình)
            void suggest() {
              cancel = false;
              final int[] B = cur.clone();
              if ((uci == null || !uci.ready) && engTry < 3) {
                engTry++;
                say("Đang khởi động lại Pikafish…", null);
                startEngine();
              }
              say("Đang tính nước đi…", lastNote.isEmpty() ? null : lastNote);
              int[] r;
              String tag = "Engine dự phòng ✗ " + (uci != null ? uci.err : "");
              Uci.Res pr = (uci != null && uci.ready) ? uci.go(Uci.fen(B), THINK_MS) : null;
              if (cancel) return;   // bạn đã bấm tiếp trong lúc máy nghĩ
              if (pr != null && pr.best.startsWith("(")) { say("Hết nước đi", "Ván cờ đã kết thúc?"); return; }
              if (pr != null && pr.best.length() >= 4) {
                int m0 = Uci.parse(pr.best);
                int sc0 = pr.cp;
                if (pr.mate) sc0 = pr.mateIn > 0 ? Engine.MATE - (2 * pr.mateIn - 1) : -Engine.MATE - 2 * pr.mateIn;
                eng.rootPvLen = 1;
                eng.rootPv[0] = m0;
                if (pr.pv.length > 0 && pr.pv[0].equals(pr.best)) {
                  for (int k = 1; k < pr.pv.length && k < 8; k++) {
                    if (pr.pv[k].length() < 4) break;
                    eng.rootPv[eng.rootPvLen++] = Uci.parse(pr.pv[k]);
                  }
                }
                r = new int[]{m0, sc0, pr.depth};
                tag = "Pikafish";
                engTry = 0;
              } else {
                r = eng.best(B, 6000);
              }
              if (cancel) return;
              if (r == null) { say("Hết nước đi", "Ván cờ đã kết thúc?"); return; }
              String chk = eng.gives(B, r[0]) ? " · CHIẾU!" : "";
              String head = lastNote.isEmpty() ? "" : lastNote + "\n";
              say("▶ " + Notation.viet(B, r[0]), head + Notation.sq(B, r[0]) + chk + "\n" + eng.verdict(r[1]) + " · sâu " + r[2] + " · " + tag + "\nDự kiến: " + eng.line(B, 5)
                  + "\nĐi xong bấm nút xanh \"Đối thủ đi\"");
            }

            // ---------- Giải thế cờ ----------
            Bitmap grab() {
              Image img = reader.acquireLatestImage();
              if (img != null) {
                Bitmap nb = toBmp(img);
                img.close();
                last = nb;
              }
              return last;
            }

            // Đọc thế cờ đang hiện trên màn hình rồi tìm đường chiếu hết (hoặc nước tốt nhất) cho bên được chọn đi trước.
            // Chạm nút = bên dưới đi trước; giữ nút = bên trên đi trước.
            void solve(final boolean mineMoves) {
              if (!running || calibrating) return;
              cancel = true;
              waiting = false;
              setWaitBtn(false);
              if (uci != null) uci.abort();
              say("Giải thế cờ…", "Đang đọc bàn cờ");
              bg.post(new Runnable() {
                @Override public void run() {
                  try { doSolve(mineMoves); } catch (Throwable t) { say("Lỗi giải thế", String.valueOf(t)); }
                }
              });
            }

            void doSolve(boolean mineMoves) {
              cancel = false;
              force = false;
              Bitmap bm = grab();
              if (bm == null) { say("Chưa có hình màn hình", "Đợi 1 giây rồi bấm lại"); return; }
              recog.scan(bm, g);
              int pieces = 0;
              for (int i = 0; i < 90; i++) if (recog.occ[i] != 0) pieces++;
              if (pieces < 3) { say("Chưa thấy bàn cờ", "Giữ bong bóng để căn lại lưới"); return; }
              // Thế cờ lẻ quân có thể làm "màu đa số ở nửa dưới" sai: thử cả hai cách gán quân mình
              int maj = recog.mineOcc;
              int[] B = readBoard(bm, mineMoves, true);
              if (B == null) { recog.mineOcc = 3 - maj; B = readBoard(bm, mineMoves, true); }
              if (B == null) { recog.mineOcc = maj; B = readBoard(bm, mineMoves, false); if (B == null) return; }
              mineC = recog.mineOcc;
              cur = B.clone();
              turnMine = mineMoves;
              lastNote = "";
              prevOcc = ""; stableN = 0; miss = 0;
              final int[] BB = B.clone();
              if ((uci == null || !uci.ready) && engTry < 3) {
                engTry++;
                say("Đang khởi động lại Pikafish…", null);
                startEngine();
              }
              if (uci != null && uci.ready) {
                say("Đang giải thế…", "Pikafish tính tối đa " + (SOLVE_MS / 1000) + " giây, thấy chiếu hết sẽ dừng sớm");
                Uci.Res pr = uci.solve(Uci.fen(BB, mineMoves), SOLVE_MS, new Uci.Prog() {
                  @Override public void on(Uci.Res r) {
                    String s = r.mate ? (r.mateIn > 0 ? "Thấy chiếu hết sau " + r.mateIn + " nước" : "Bên đi sẽ bị chiếu hết sau " + (-r.mateIn) + " nước") : eng.verdict(r.cp);
                    say("Đang giải thế… sâu " + r.depth, s);
                  }
                });
                if (cancel) return;
                if (pr.best.startsWith("(")) { say("Không có nước đi", "Thế này đã hết cờ (bị chiếu hết hoặc hết nước)"); return; }
                if (pr.best.length() >= 4) { showSolution(BB, mineMoves, pr); return; }
              }
              // Dự phòng: engine Java (bên trên đi trước thì lật bàn cờ để bên đó thành "mình")
              int[] sb = mineMoves ? BB : Engine.flip(BB);
              say("Đang giải bằng engine dự phòng…", "Yếu hơn Pikafish, tối đa 20 giây");
              int[] r = eng.best(sb, 20000);
              if (cancel) return;
              if (r == null) { say("Không có nước đi", "Thế này đã hết cờ?"); return; }
              say("🧩 " + eng.verdict(r[1]), (mineMoves ? "Bên dưới" : "Bên trên") + " đi trước · sâu " + r[2] + "\n▶ " + Notation.viet(sb, r[0])
                  + "\n" + eng.line(sb, 12) + "\nEngine dự phòng (Pikafish chưa chạy)");
            }

            void showSolution(int[] B, boolean mineMoves, Uci.Res pr) {
              String title;
              if (pr.mate && pr.mateIn > 0) title = "🧩 Thắng: chiếu hết sau " + pr.mateIn + " nước";
              else if (pr.mate) title = "🧩 Bên đi sẽ bị chiếu hết sau " + (-pr.mateIn) + " nước";
              else title = "🧩 Chưa thấy chiếu hết · " + eng.verdict(pr.cp);
              String[] pv = (pr.pv.length > 0 && pr.pv[0].equals(pr.best)) ? pr.pv : new String[]{pr.best};
              int m0 = Uci.parse(pr.best);
              String first = mineMoves ? Notation.viet(B, m0) : Notation.viet(Engine.flip(B), Engine.fm(m0));
              String tail = (pr.mate && pr.mateIn > 0) ? "" : "\n(Thế hòa hoặc cần tính sâu hơn)";
              say(title, (mineMoves ? "Bên dưới" : "Bên trên") + " đi trước · sâu " + pr.depth + "\n▶ " + first + "\n" + pvLine(B, pv, mineMoves, 24) + tail
                  + (mineMoves ? "\nĐi xong bấm nút xanh \"Đối thủ đi\"" : ""));
            }

            // Biến chính bằng ký hiệu tiếng Việt, mỗi dòng một cặp nước (mỗi bên theo góc nhìn của chính nó)
            String pvLine(int[] B0, String[] pv, boolean mineFirst, int max) {
              StringBuilder sb = new StringBuilder();
              int[] bb = B0.clone();
              boolean mine = mineFirst;
              for (int i = 0; i < pv.length && i < max; i++) {
                if (pv[i].length() < 4) break;
                int m = Uci.parse(pv[i]);
                int p = bb[m >> 8];
                if (p == 0 || (p > 0) != mine) break;
                int[] vb = mine ? bb : Engine.flip(bb);
                int vm = mine ? m : Engine.fm(m);
                if (i % 2 == 0) { if (i > 0) sb.append("\n"); sb.append(i / 2 + 1).append(". "); } else sb.append("  ·  ");
                sb.append(Notation.viet(vb, vm));
                bb[m & 255] = bb[m >> 8]; bb[m >> 8] = 0;
                mine = !mine;
              }
              return sb.toString();
            }

            @Override public void onDestroy() {
              running = false;
              try { if (bubble != null) wm.removeView(bubble); } catch (Exception e) { }
              try { if (calib != null) wm.removeView(calib); } catch (Exception e) { }
              try { if (rbtn != null) wm.removeView(rbtn); } catch (Exception e) { }
              try { if (ebtn != null) wm.removeView(ebtn); } catch (Exception e) { }
              try { if (sbtn != null) wm.removeView(sbtn); } catch (Exception e) { }
              try { if (vd != null) vd.release(); } catch (Exception e) { }
              try { if (reader != null) reader.close(); } catch (Exception e) { }
              try { if (proj != null) proj.stop(); } catch (Exception e) { }
              try { if (uci != null) uci.stop(); } catch (Exception e) { }
              if (ht != null) ht.quitSafely();
              super.onDestroy();
            }
          }
          EOF

      - name: Build Pikafish (engine manh nhat)
        continue-on-error: true
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          echo "NDK=$NDK"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$TC:$PATH"
          which aarch64-linux-android21-clang++
          git clone --depth 1 https://github.com/official-pikafish/Pikafish.git /tmp/pikafish
          OUTD="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$OUTD"
          cd /tmp/pikafish/src
          make -j"$(nproc)" build ARCH=armv8 COMP=ndk EXTRALDFLAGS="-Wl,-z,max-page-size=16384"
          "$TC/llvm-strip" pikafish
          cp pikafish "$OUTD/libpikafish.so"
          make clean || true
          if make -j"$(nproc)" build ARCH=armv8-dotprod COMP=ndk EXTRALDFLAGS="-Wl,-z,max-page-size=16384"; then
            "$TC/llvm-strip" pikafish
            cp pikafish "$OUTD/libpikafish_dp.so"
          else
            echo "Khong build duoc ban dotprod, chi dung ban armv8"
          fi
          ls -l "$OUTD"

      - name: Tai mang NNUE cua Pikafish (BAT BUOC - thieu file nay engine se tu thoat)
        run: |
          set -e
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --max-time 900 -o app/src/main/assets/pikafish.nnue https://github.com/official-pikafish/Networks/releases/download/master-net/pikafish.nnue
          SZ=$(stat -c %s app/src/main/assets/pikafish.nnue)
          echo "NNUE size: $SZ"
          test "$SZ" -gt 10000000

      - name: Kiem tra engine da duoc build
        run: |
          test -f app/src/main/jniLibs/arm64-v8a/libpikafish.so || { echo "LOI: build Pikafish that bai, APK se khong co engine manh"; exit 1; }

      - name: Build APK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: CoTuongHelper-APK
          path: app/build/outputs/apk/debug/app-debug.apk
